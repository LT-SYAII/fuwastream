name: Build APK

on:
  push:
    branches: [main, qa-smoke]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      smoke:
        description: Run the emulator smoke test and capture screenshots
        type: boolean
        default: false
      qa:
        description: QA run with animations on, gesture navigation and screen recordings
        type: boolean
        default: false
      profile:
        description: Generate the baseline profile on an emulator and upload it as an artifact
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags are needed to derive the version name

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Release signing secrets are missing. Set KEYSTORE_BASE64, KEYSTORE_PASSWORD and KEY_ALIAS."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Set version name
        run: |
          # 30M offset keeps codes above installs made by older builds (epoch-minute codes ~29.7M).
          echo "VERSION_CODE=$((30000000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            # Builds from main are named after the latest stable release tag, e.g. 2.1.0-build.14.
            # Ignore prerelease tags such as v2.0.0-build.1 so the name never nests build suffixes.
            BASE=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            [ -n "$BASE" ] || BASE=v2.1.0
            echo "VERSION_NAME=${BASE#v}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle testDebugUnitTest assembleRelease --stacktrace

      - name: Build AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        # ABI splits and app bundles cannot be built in the same invocation.
        run: gradle bundleRelease -PabiSplits=false --stacktrace

      - name: Verify release signing certificate
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          APK=$(ls app/build/outputs/apk/release/*arm64-v8a*.apk 2>/dev/null | head -1)
          [ -n "$APK" ] || APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          # build-tools 35 and older print "Signer #1 certificate SHA-256 digest:",
          # while newer versions print "V2 Signer: certificate SHA-256 digest:".
          CERT=$(grep 'certificate SHA-256 digest' "$RUNNER_TEMP/apksigner.txt" \
            | head -1 | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f')
          echo "APK signing certificate SHA-256: $CERT"
          test -n "$CERT"
          # Pinned to the permanent FuwaStream keystore so an update never ships with another key.
          test "$CERT" = "1cdbc56c56c6dba68fbf74c0dde37b428b6fa9ec57fe6ee1316fd70083767544"

      - name: Rename artifacts
        run: |
          mkdir -p dist
          for apk in app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$apk" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            cp "$apk" "dist/FuwaStream-${VERSION_NAME}-${abi}.apk"
          done
          cp app/build/outputs/bundle/release/*.aab "dist/FuwaStream-${VERSION_NAME}.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: FuwaStream-${{ env.VERSION_NAME }}
          path: dist/*

      - name: Publish release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          # Tag pushes keep their own tag; pushes to main get an automatic build-N tag.
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: FuwaStream ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          make_latest: true

  smoke:
    needs: build
    if: (github.event_name == 'workflow_dispatch' && (inputs.smoke || inputs.qa)) || (github.event_name == 'push' && github.ref == 'refs/heads/qa-smoke')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: apk
          merge-multiple: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: ${{ !inputs.qa }}
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: .github/scripts/${{ inputs.qa && 'qa' || 'smoke' }}.sh "$(ls apk/*x86_64*.apk 2>/dev/null | head -1 || ls apk/*.apk | head -1)" screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: screenshots/

  profile:
    if: github.event_name == 'workflow_dispatch' && inputs.profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: gradle :app:generateBaselineProfile --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: baseline-profile
          path: app/src/release/generated/baselineProfiles/
